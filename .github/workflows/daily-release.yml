name: Daily Brazil Speed Cameras Release

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch Brazil speed cameras & build csv_files.zip
        run: python fetch_br_speed_cameras.py --out-dir dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_id }}" dist/csv_files.zip \
            --title "Brazil Speed Cameras (${{ github.run_number }})" \
            --notes $'Automated OpenStreetMap (ODbL 1.0) Brazil fixed speed-camera dataset.\n- `csv_files.zip` contains `GATSO_ALL.csv`, `br_speed_cameras.csv`, and `ATTRIBUTION.md`.'
